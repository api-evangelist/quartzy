    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Unlimited Users
  - name: Advanced Procurement and Integrations
  - name: Public API and Webhooks
  - name: SSO and Security Review
  - name: Dedicated Support
