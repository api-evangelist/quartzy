description: >-
  FinOps view of Quartzy spend. Quartzy is a subscription SaaS: cost is driven
  by the plan tier (Academia, Industry, Enterprise) and the number of user seats
  above each plan's included allotment, not by API consumption. The Public API
  and Webhooks are bundled into the subscription with no separate per-call fee,
  so integration usage does not add a metered line item. A distinct, related
  spend stream is procurement itself - actual lab supplies purchased through
  Quartzy's catalog - which is real purchasing cost partly offset by the shop
  credit included with each plan. Enterprise agreements cover custom seat counts
  and terms.
notes: >-
  API access carries no incremental charge; optimize Quartzy spend by
  right-sizing plan tier and seat count, and manage catalog procurement spend
  separately. Verify current plan prices, seat inclusions, and shop credit on
  the Quartzy pricing page during reconciliation.
