meters:
- name: subscription_plan
  description: Recurring subscription fee for the selected Quartzy plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - organization
  - plan
- name: user_seats
  description: User seats consumed above the plan's included allotment.
  unit: users
  aggregation: max
  dimensions:
  - organization
  - lab
- name: catalog_procurement
  description: Actual lab supplies purchased through the Quartzy catalog, offset by included shop credit.
  unit: currency
  aggregation: sum
  dimensions:
  - organization
  - lab
  - vendor
- name: api_usage
  description: Public API and webhook usage; bundled into the subscription at no incremental charge.
  unit: requests
  aggregation: sum
  dimensions:
  - organization
principles:
- name: Visibility
  description: Track subscription tier, active seats per lab, and catalog procurement spend per lab and vendor.
- name: Allocation
  description: Map labs and organizations to internal cost centers so subscription and procurement spend is attributed correctly.
- name: Optimization
  description: Right-size the plan tier and seat count to actual usage, apply included shop credit, and consolidate ordering to reduce procurement cost; the API itself adds no marginal cost.
- name: Accountability
  description: Assign an owner per organization to review seat utilization and procurement spend against budget each billing cycle.
